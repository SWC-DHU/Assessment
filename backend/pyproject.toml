[project]
name = "process-agent-playground-backend"
version = "0.1.0"
description = "Lightweight sandbox backend for Process Requirement Extraction & Template Filling Agents"
readme = {text = "FastAPI workspace and standalone manufacturing semantics.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "python-multipart>=0.0.12",
    "openai>=1.51.0",
    "httpx>=0.27.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "docxtpl>=0.18.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "rdflib>=7.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "domain_semantics*"]
namespaces = true

[tool.setuptools.package-data]
domain_semantics = ["ontology/*.ttl", "ontology/versions/*/*.ttl", "ontology/versions/*/*.yaml", "vocabulary/*.yaml", "prompts/*.txt"]
