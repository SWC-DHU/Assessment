demand_resource_mappings:
  - demand_aspect: 所需制造能力 (Operation.required_capability_codes)
    resource_aspect: 模型提供能力 (ModelAsset.capabilities[].code)
    ontology_relation: satisfiesCapability
    mechanism: 受控能力编码精确匹配与多能力集合覆盖
  - demand_aspect: 输入输出物料 (Operation.input/output_material_ids)
    resource_aspect: 模型物料适配条件 (ModelAsset.material_compatibility.supported_material_types)
    ontology_relation: handlesMaterial
    mechanism: 标准物料类型映射与输入/输出物料集合适配校验
  - demand_aspect: 工艺约束 (Constraint.parameter_code / related_parameter_codes)
    resource_aspect: 模型技术参数与定性支持 (ModelAsset.parameters / material_compatibility)
    ontology_relation: addressesConstraint
    mechanism: 同参数编码+单位换算三值校验 (PASS/FAIL/UNKNOWN) 与定性约束核验
  - demand_aspect: 物料状态要求 (Operation.input/output_state_ids)
    resource_aspect: 模型支持状态转换 (ModelAsset.material_compatibility.state_transitions)
    ontology_relation: supportsState
    mechanism: 标准物料状态编码映射与输入→输出状态转换核验
  - demand_aspect: 设备要求 (Operation.equipment_requirement)
    resource_aspect: 模型类别及功能描述 (ModelAsset.identity.category / capabilities)
    ontology_relation: assetCategory
    mechanism: 受控设备类别匹配与语义/LLM辅助消歧
  - demand_aspect: 信息流要求 (Operation.information_flows)
    resource_aspect: 模型信息接口 (ModelAsset.interfaces[type=information])
    ontology_relation: hasInterface
    mechanism: 信息接口方向与数据载荷兼容性检查
